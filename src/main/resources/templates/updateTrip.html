<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Trip</title>
  <link rel="stylesheet" type="text/css" media="all" href="/css/menu.css" th:href="@{/css/menu.css}" />
  <link rel="stylesheet" type="text/css" media="all" href="/css/index.css" th:href="@{/css/index.css}" />
  <link rel="stylesheet" type="text/css" media="all" href="/css/date.css" th:href="@{/css/date.css}" />
  <link rel="stylesheet" type="text/css" media="all" href="/css/form.css" th:href="@{/css/form.css}" />
</head>
<body>

  <th:block th:include="/menu/menu"></th:block>

  <div class="center-div">
    <div class="form-container">
      <form th:action="@{/updateTripForm}" th:object="${tripDTO}" method="post" id="survey-form">

        <div th:if="${message}" style="color: red;">
          <p th:text="${message}"></p>
        </div>

        <input type="hidden" th:field="*{id}" th:value="${id}" />
        <input type="hidden" th:field="*{start_date}" th:value="${start_date}" />
        <input type="hidden" th:value="*{order.id}" name="orderId" />
        <input type="hidden" th:value="*{driver.id}" name="driverId"/>
        <input type="hidden" th:value="*{car.id}" name="carId"/>

        <div class="form-group">
          <label >Start Date:</label>
          <input type="text" id="dateInput" placeholder="Select a date" th:field="*{start_date}">
          <div class="calendar" id="calendar">
            <div class="header">
              <button id="prevBtn" type="button">&lt;</button>
              <h2 id="monthYear">Month Year</h2>
              <button id="nextBtn" type="button">&gt;</button>
            </div>
            <div class="days" id="daysContainer"></div>
          </div>
        </div>

        <div class="form-group">
          <label>End Date:</label>
          <input type="text" id="dateInput2" placeholder="Select a date" th:field="*{end_date}">
          <div class="calendar" id="calendar2">
            <div class="header">
              <button id="prevBtn2" type="button">&lt;</button>
              <h2 id="monthYear2">Month Year</h2>
              <button id="nextBtn2" type="button">&gt;</button>
            </div>
            <div class="days" id="daysContainer2"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="price">Price:</label>
          <input type="number" id="price" th:field="*{price}">
        </div>

        <div class="form-group">
          <input type="submit" id="submit" value="Update Trip">
        </div>

      </form>
    </div>

  </div>

  <script src="/js/date.js" th:src="@{/js/date.js}"></script>
  <script src="/js/date2.js" th:src="@{/js/date2.js}"></script>
</body>
</html>
