<!DOCTYPE html>
<html lang="en" xmlns =="http://www.w3.org/1999/ xmlns th =="http://www.thymeleaf.>
<head>

    <meta charset="UTF-8">
    <title>Orders</title>
    <link rel="stylesheet" type="text/css" media="all" href="/css/menu.css" th:href="@{/css/menu.css}" />
    <link rel="stylesheet" type="text/css" media="all" href="/css/index.css" th:href="@{/css/index.css}" />
</head>
<body>
<header>
    <a href="#" class="logo">AutoBase</a>
    <nav class="site-nav">
        <ul>
            <li><a href="#">Orders</a></li>
            <li><a href="#">Actionable Trips</a></li>
            <li><a href="#">Drivers</a></li>
            <li><a th:href="@{/logout}">Logout</a></li>
        </ul>
    </nav>


</header>

<div class="orders-container">
    <div th:each="order : ${orders}" class="order-card">
        <div class="order-field"><strong>Request Date:</strong> <span th:utext="${order.requestData}"></span></div>
        <div class="order-field"><strong>Cargo Weight:</strong> <span th:utext="${order.cargoWeight}"></span></div>
        <div class="order-field"><strong>Cargo Type:</strong> <span th:utext="${order.cargoType}"></span></div>
        <div class="order-field"><strong>Destination:</strong> <span th:utext="${order.destination}"></span></div>
    </div>
</div>

</body>
</html>
