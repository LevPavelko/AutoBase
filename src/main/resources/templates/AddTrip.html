<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Trip</title>
    <link rel="stylesheet" type="text/css" media="all" href="/css/menu.css" th:href="@{/css/menu.css}" />
    <link rel="stylesheet" type="text/css" media="all" href="/css/index.css" th:href="@{/css/index.css}" />
</head>
<body>
    <th:block th:include="/menu/menu"></th:block>
    <div th:if="${message}" style="color: red;">
        <p th:text="${message}"></p>
    </div>
    <form th:action="@{/AddTripForm}" th:object="${tripDTO}" method="post" >

        <input type="hidden" name="orderId" th:value="${orderId}" />

        <label>Driver:</label>
        <select name="driverId">
            <option value="" disabled selected>Select a driver</option>
            <option th:each="driver : ${drivers}"
                    th:value="${driver.id}"
                    th:text="${driver.userDTO.firstName}">
            </option>
        </select>

        <label>Car:</label>
        <select name="carId">
            <option value="" disabled selected>Select a car</option>
            <option th:each="car : ${cars}"
                    th:value="${car.id}"
                    th:text="${car.id}">
            </option>
        </select>

        <label for="start_date">Start Date:</label>
        <input type="date" id="start_date" th:field="*{start_date}">


        <label for="price">Price:</label>
        <input type="number" id="price" th:field="*{price}">


        <button type="submit">Add Trip</button>
    </form>

</body>
</html>
